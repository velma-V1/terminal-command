[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-command"
version = "0.1.0"
description = "Terminal-native personal operating layer for natural-language, shell, and selectable command workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "prompt-toolkit>=3.0,<4",
  "rich>=13,<15",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
terminal-command = "terminal_command.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

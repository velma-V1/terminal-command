name: V3 Foundation

on:
  push:
    branches: [feat/v3-greenfield-terminal]
    paths:
      - 'src/Terminal.**'
      - 'tests/Terminal.**'
      - 'Terminal.slnx'
      - 'Directory.Build.props'
      - '.github/workflows/v3-foundation.yml'
  pull_request:
    paths:
      - 'src/Terminal.**'
      - 'tests/Terminal.**'
      - 'Terminal.slnx'
      - 'Directory.Build.props'
      - '.github/workflows/v3-foundation.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Terminal.slnx
      - name: Build
        run: dotnet build Terminal.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test Terminal.slnx --configuration Release --no-build --logger "trx;LogFileName=v3-foundation.trx"
